interface:
  display_name: "Design Project Topology"
  short_description: "Compile and validate customizable execution plans."
  default_prompt: "Use $design-project-topology to audit project truth, select and connect only justified macro-modules, and compile the exact execution-plan template. For an expensive multi-check gate, define checkpointed check units, conservative pass reuse, continuation after ordinary failures, and batched repair; use FAST_LANE_V2 only for the defined scoped-product route. Require IDs only for multi-agent runtime instances, not ordinary plan content, and validate the plan and role mapping."
policy:
  allow_implicit_invocation: false
