interface:
  display_name: "Run Firmware Test Suite"
  short_description: "Keep all eligible firmware lanes running in parallel"
  default_prompt: "Use $run-firmware-test-suite to launch or resume every dependency-ready, resource-compatible persistent doer lane concurrently, with one stable named doer per lane, one assigned doer per task, and one active task per doer. Treat dependency-wave rows only as visual hints and catalog section 11.1 as the authoritative cross-test edge list: compute readiness per phase, start eligible later-row work immediately, and never serialize unrelated lanes behind an unfinished or blocked test. Reuse Atlas, Boreal, Cygnus, and Delta across their assigned gpt-5.6-luna tasks at high reasoning on the regular/default tier; use Nova only for A23 with Claude Sonnet 5, or its recorded continuity-contract gpt-5.6-luna fallback after a bounded provider outage. Use manager-owned board/global resource tokens, isolated runs, recorded delegated authorization, and exactly one validated orchestrator_harness managed watcher for overlapping or HIL/server-consuming epochs. The current high-level session remains sole manager: inspect durable notifications and each live doer every two to three minutes during HIL, make exact relay/recovery decisions, acknowledge exact event IDs, heartbeat the watcher, and stop or hand it off cleanly. Never invent a physical-fact, evidence-modality, optional-instrument, or blanket dependency blocker beyond the catalog, live server, pass/fail oracle, or genuine hardware safety need. Treat D35/R37/R38 as autonomous non-gating try-last appendix work. Use gpt-5.6-terra reviewer/repair roles at high reasoning on the priority/Fast service tier. Only the main model may validate and queue server defects; checkpoint and freeze server/HIL consumers before serial change-loops while isolated board-free non-server work continues."
